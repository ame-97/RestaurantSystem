<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio de Sesión</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="login-page">

  <div class="bg-image"></div>
  <div class="vignette"></div>
  <div class="deco-line top-left"></div>
  <div class="deco-line bottom-right"></div>

  <div class="wrapper">
    <div class="card">

      <div class="panel-brand">
        <div>
          <p class="brand-eyebrow">Ámbar</p>
          <h1 class="brand-title">Bienvenido<br>de <em>nuevo</em></h1>
          <p class="brand-desc">
            Accede a tu cuenta para gestionar reservaciones, menú y mucho más.
          </p>
        </div>

        <div>
          <div class="social-row">
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
          </div>

          <div class="brand-quote">
            <p>"La buena comida es el fundamento de<br>la auténtica felicidad."</p>
          </div>
        </div>
      </div>

      <div class="panel-form">
        <p class="form-eyebrow">Acceso</p>
        <h2 class="form-title">Inicio de Sesión</h2>

        <form id="loginForm" novalidate>

          <!-- Email -->
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <div class="input-wrap">
              <input type="email" id="email" placeholder="tucorreo@email.com" required>
              <i class="fa-regular fa-envelope"></i>
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrap">
              <!-- Restricción básica de longitud -->
              <input 
                type="password" 
                id="password" 
                placeholder="Mínimo 8 caracteres" 
                minlength="8" 
                maxlength="15" 
                required
              >
              <i class="fa-regular fa-lock"></i>
            </div>
          </div>

          <!-- Submit principal -->
          <button class="btn-submit" type="submit">
            Iniciar Sesión
          </button>


          <div id="loginAlert" class="alert-box">
            <span id="loginAlertText"></span>
          </div>

          <div class="divider">o</div>

          <!-- Redirección a registro -->
          <a href="registro.html" class="extra-link">
            ¿No tienes cuenta? <span>Regístrate aquí</span>
          </a>

        </form>
      </div>

    </div>
  </div>

  <!-- Lógica JS del login -->
    <script src="js/login.js"></script>
</body>
</html>
