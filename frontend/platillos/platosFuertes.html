<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platos Fuertes</title>
  <link rel="stylesheet" href="../css/menu.css">
  <link rel="stylesheet" href="/css/layout.css">
  <!-- ICONOS -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="bread" id="pag12"></div>

<main class="container">

  <header class="menu-header">
    <h1>Platos Fuertes</h1>
    <p>Explora nuestros platillos</p>
  </header>

  <section class="menu-section">
    <h2>Platos Fuertes</h2>

    <div class="cards-grid">

      <article class="card" data-category="fuertes">
        <img src="../img/ham.png" alt="Hamburguesa">
        <div class="card-body">
          <h3>Hamburguesa</h3>
          <span class="price">$90</span>
          <a href="ham.html" class="btn">Ver</a>
        </div>
      </article>

      <article class="card" data-category="fuertes">
        <img src="../img/tacos.jpg" alt="Tacos">
        <div class="card-body">
          <h3>Tacos</h3>
          <span class="price">$80</span>
          <a href="tacos.html" class="btn">Ver</a>
        </div>
      </article>

      <article class="card" data-category="fuertes">
        <img src="../img/pizza.png" alt="Pizza">
        <div class="card-body">
          <h3>Pizza</h3>
          <span class="price">$120</span>
          <a href="pizza.html" class="btn">Ver</a>
        </div>
      </article>

    </div>

  </section>

</main>

 <div id="footer-container"></div>

  <!-- SCRIPTS -->
  <script src="../js/breadcrumb.js"></script>
  <script src="/js/layout.js"></script>

</body>
</html>
