<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postres</title>
  <link rel="stylesheet" href="../css/menu.css">
  <link rel="stylesheet" href="/css/layout.css">
  <!-- ICONOS -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- BREADCRUMB DINÁMICO -->
<div class="bread" id="pag14"></div>

<main class="container">

  <header class="menu-header">
    <h1>Postres</h1>
    <p>Explora nuestros postres</p>
  </header>

  <section class="menu-section">
    <h2>Postres</h2>

    <div class="cards-grid">

      <article class="card" data-category="postres">
        <img src="../img/pastel.png" alt="Pastel">
        <div class="card-body">
          <h3>Pastel</h3>
          <span class="price">$40</span>
          <a href="pastel.html" class="btn">Ver</a>
        </div>
      </article>

      <article class="card" data-category="postres">
        <img src="../img/helado.png" alt="Helado">
        <div class="card-body">
          <h3>Helado</h3>
          <span class="price">$35</span>
          <a href="helado.html" class="btn">Ver</a>
        </div>
      </article>

    </div>

  </section>

</main>

 <div id="footer-container"></div>

  <!-- SCRIPTS -->
  <script src="../js/breadcrumb.js"></script>
  <script src="/js/layout.js"></script>

</body>
</html>
