<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aguas Frescas</title>

  <!-- ESTILOS GLOBALES -->
  <link rel="stylesheet" href="/css/layout.css">

  <!-- ESTILOS DE MENÚ -->
  <link rel="stylesheet" href="../css/menu2.css">

  <!-- ICONOS -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <meta name="keywords" content="Aguas Frescas">
</head>

<body>

  <!-- BREADCRUMB -->
  <div class="bread" id="pag132"></div>



  <!-- CONTENIDO PRINCIPAL -->
  <main class="container">

    <header class="menu-header">
      <h1>Aguas Frescas</h1>
      <p>Bebidas naturales y refrescantes</p>
    </header>

    <section class="menu-section">

      <div class="cards-grid">

        <article class="card" data-category="bebidas">
          <img src="../img/agua.png" alt="Agua fresca">

          <div class="card-body">
            <h3>Agua fresca</h3>

            <p class="card-desc">
              Bebida natural y refrescante, elaborada con frutas frescas,
              agua purificada y un toque suave de dulzor.
              Ideal para hidratarte y acompañar cualquier comida.
            </p>

            <span class="price">$20</span>

            <a href="/ordenar.html" class="btn">Ordenar</a>
          </div>
        </article>

      </div>

    </section>

  </main>

  <!-- FOOTER DINÁMICO -->
  <div id="footer-container"></div>

  <!-- SCRIPTS -->
  <script src="../js/breadcrumb.js"></script>
  <script src="/js/layout.js"></script>

</html>
