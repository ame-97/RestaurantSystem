<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orden</title>

    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="css/orden.css">

    <script src="js/eventos.js"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>


<header id="header-container"></header>



<main class="main-content">


<div id="mensajeSesion" class="mensaje error" style="display:none;"></div>



<form class="card form" id="formOrdenar">


<h1 class="center">
    ORDENA TU COMIDA
</h1>




<!-- TIPO PEDIDO -->

<label for="tipoPedido">
    Tipo de pedido
</label>


<select id="tipoPedido" required>


    <option value="">
        Selecciona tipo de pedido
    </option>


    <option value="Para llevar">
        Para llevar
    </option>


    <option value="A domicilio">
        A domicilio
    </option>


</select>






<input
    id="nombre"
    type="text"
    placeholder="Nombre completo"
    minlength="10"
    required
>





<select id="platillo" required>

    <option value="">
        Selecciona tu platillo
    </option>

</select>



<p id="estadoPlatillos" class="api-order-status"></p>






<input
    id="telefono"
    type="tel"
    placeholder="Número telefónico"
    pattern="[0-9]{10}"
    title="Ingresa 10 dígitos"
    required
>






<input
    id="cantidad"
    type="number"
    placeholder="Cantidad"
    min="1"
    max="10"
    required
>







<!-- DATOS DOMICILIO -->

<div id="datosDireccion" style="display:none;">


<h3>
    Dirección de entrega
</h3>



<input
    id="calle"
    type="text"
    placeholder="Calle y número"
>




<input
    id="colonia"
    type="text"
    placeholder="Colonia"
>




<input
    id="referencia"
    type="text"
    placeholder="Referencia"
>


<p id="estadoDireccion" class="api-order-status"></p>


<input
    type="hidden"
    id="latitud"
>




<input
    type="hidden"
    id="longitud"
>


</div>








<!-- METODO PAGO -->


<label for="metodoPago">

    Método de pago

</label>



<select id="metodoPago" required>


<option value="">

    Selecciona método de pago

</option>



<option value="Efectivo">

    Efectivo

</option>




<option value="Tarjeta al recibir">

    Tarjeta al recibir

</option>




<option value="Tarjeta simulada">

    Tarjeta simulada

</option>


</select>




<!-- DATOS TARJETA (SOLO PAGO SIMULADO) -->

<div id="datosTarjeta" style="display:none;">


<h3>
    Datos de la tarjeta
</h3>


<p class="aviso-simulado">
    Pago simulado con fines de prueba: no se realiza ningún cargo real y los
    datos de la tarjeta no se guardan ni se envían al servidor.
    <br>
    Tarjetas de prueba —
    <strong>aprobada:</strong> 4242 4242 4242 4242 ·
    <strong>declinada:</strong> 4000 0000 0000 0002
</p>



<input
    id="numeroTarjeta"
    type="text"
    inputmode="numeric"
    placeholder="Número de tarjeta"
    maxlength="19"
    autocomplete="off"
>



<input
    id="titularTarjeta"
    type="text"
    placeholder="Nombre del titular"
    autocomplete="off"
>



<div class="fila-tarjeta">


    <input
        id="vencimientoTarjeta"
        type="text"
        inputmode="numeric"
        placeholder="MM/AA"
        maxlength="5"
        autocomplete="off"
    >


    <input
        id="cvvTarjeta"
        type="password"
        inputmode="numeric"
        placeholder="CVV"
        maxlength="4"
        autocomplete="off"
    >


</div>


<p id="estadoTarjeta" class="api-order-status"></p>


</div>







<textarea
    id="comentarios"
    placeholder="Comentarios (opcional)"
    minlength="5"
    maxlength="30"
></textarea>






<br><br>



<p id="estadoPedido" class="mensaje"></p>



<button type="submit">

    Confirmar pedido

</button>



<br><br>



</form>







<h2 class="titulo-resumen">

    Tus pedidos

</h2>




<div class="lista" id="lista"></div>





</main>





<div id="footer-container"></div>





<script src="js/pago.js"></script>

<script src="js/orden.js"></script>

<script src="js/layout.js"></script>



</body>

</html>
